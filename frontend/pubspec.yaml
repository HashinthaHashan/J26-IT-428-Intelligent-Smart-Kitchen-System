name: kitchenguard
description: KitchenGuard Phase 4 mobile client.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  riverpod_annotation: ^4.0.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
