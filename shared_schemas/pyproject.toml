[project]
name = "kitchenguard-schemas"
version = "0.1.0"
description = "Shared Pydantic contracts for KitchenGuard Phase 0."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kitchenguard_schemas*"]
